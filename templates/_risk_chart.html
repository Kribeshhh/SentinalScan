<svg class="risk-chart" viewBox="0 0 800 230" role="img" aria-labelledby="trend-title trend-description"><title id="trend-title">SentinelScan Risk Score by scan</title><desc id="trend-description">Each point is a stored scan risk score. Each point title provides scan ID, date and exact value. Points are equally spaced in scan order.</desc>{% for score in [0,25,50,75,100] %}<line x1="50" x2="750" y1="{{ 180-score*1.4 }}" y2="{{ 180-score*1.4 }}" class="chart-grid"/><text x="12" y="{{ 184-score*1.4 }}">{{ score }}</text>{% endfor %}<polyline class="chart-line" points="{% for point in points %}{{ point.x }},{{ point.y }} {% endfor %}"/>{% for point in points %}<circle cx="{{ point.x }}" cy="{{ point.y }}" r="4" class="chart-point"><title>Scan {{ point.id }} · {{ point.score }}/100 · {{ point.created_at }}</title></circle>{% endfor %}<text x="50" y="215">Oldest shown</text><text x="650" y="215">Newest shown</text></svg>
